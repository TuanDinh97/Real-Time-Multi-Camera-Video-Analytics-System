[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-occupancy"
version = "0.1.0.dev0"
description = "Indoor occupancy and space utilization from camera streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Công cụ dev và export model; KHÔNG có trong image production (spec D7)
tools = [
    "ultralytics>=8.3",
    "torch>=2.8",          # GPU Blackwell cần bản build CUDA >= 12.8; kiểm tra ở 2A.6
    "opencv-python>=4.8",
]
oak = ["depthai>=3.0"]

[project.scripts]
occ = "occ.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
