[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-occupancy"
version = "0.1.0.dev0"
description = "Indoor occupancy and space utilization from camera streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
# Công cụ dev và export model; KHÔNG có trong image production (spec D7)
tools = [
    "ultralytics>=8.3",
    "torch>=2.8",          # GPU Blackwell cần bản build CUDA >= 12.8; kiểm tra ở 2A.6
    "opencv-python>=4.8",
]
oak = [
    "depthai>=3.0",
    "numpy>=2.5.4",
]

[project.scripts]
occ = "occ.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-shapely>=2.1.0.20261030",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép tiếng Việt trong chuỗi, docstring, comment

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cv2.imwrite".msg = "Không ghi khung hình ra đĩa (spec D4, M9). Chỉ dùng trong occ/tools/."
"cv2.VideoWriter".msg = "Không ghi video ra đĩa (spec D4, M9). Chỉ dùng trong occ/tools/."

[tool.ruff.lint.per-file-ignores]
"src/occ/tools/**" = ["TID251"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["depthai", "depthai.*"]
ignore_missing_imports = true
